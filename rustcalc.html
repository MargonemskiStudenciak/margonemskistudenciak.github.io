<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RustGrow Calculator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f2f2f2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2b2b2b;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #1f1f1f;
            color: #fff;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        input[type="number"] {
            text-transform: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #333;
            border-left: 5px solid #4CAF50;
            border-radius: 4px;
            display: none;
        }
        .result-box h3 { margin-top: 0; }
        .error { color: #ff5252; font-size: 14px; margin-top: 10px; display: none;}
    </style>
</head>
<body>

<div class="container">
    <h1>RustGrow Calculator</h1>
    <p class="subtitle">Oblicz czas wzrostu na podstawie Genów i warunków (Overall)</p>

    <label for="genetics">Klon Genetyki (np. GGYYXW):</label>
    <input type="text" id="genetics" maxlength="6" placeholder="Wpisz 6 liter (G, Y, H, X, W)">
    <div id="error-msg" class="error">Genetyka musi składać się dokładnie z 6 liter (G, Y, H, X, W).</div>

    <label for="overall">Stan Rośliny / Overall (%):</label>
    <input type="number" id="overall" min="0" max="100" value="100" placeholder="np. 100">

    <label for="stage">Aktualny Stage:</label>
    <select id="stage">
        <option value="0">Seed / Seedling (Nasiono/Kiełek)</option>
        <option value="1">Sapling (Sadzonka)</option>
        <option value="2">Crossbreed (Krzyżowanie)</option>
        <option value="3">Mature (Dojrzewanie)</option>
        <option value="4">Fruiting (Owocowanie)</option>
    </select>

    <label for="percent">Progres Stage'a (%):</label>
    <input type="number" id="percent" min="0" max="100" placeholder="np. 35">

    <button onclick="calculateTime()">Oblicz Czas</button>

    <div id="result" class="result-box">
        <h3>Wyniki:</h3>
        <p>Ilość genów 'G': <strong id="res-g">0</strong></p>
        <p>Do końca tego etapu: <strong id="res-stage">0 min</strong></p>
        <p>Czas do pełnych zbiorów: <strong style="color:#4CAF50;" id="res-total">0 min</strong></p>
    </div>
</div>

<script>
    // Orientacyjne czasy bazowe w minutach (przy 0 genów G i 100% warunków)
    const stages = [
        { name: "Seed/Seedling", baseTime: 16 }, 
        { name: "Sapling", baseTime: 20 },
        { name: "Crossbreed", baseTime: 15 },
        { name: "Mature", baseTime: 30 },
        { name: "Fruiting", baseTime: 20 }
    ];

    function calculateTime() {
        const geneticsInput = document.getElementById('genetics').value.toUpperCase();
        const overall = parseFloat(document.getElementById('overall').value);
        const stageIndex = parseInt(document.getElementById('stage').value);
        const percent = parseFloat(document.getElementById('percent').value);
        const errorMsg = document.getElementById('error-msg');
        const resultBox = document.getElementById('result');

        // Walidacja liter genetyki
        const validGenetics = /^[GYHXW]{6}$/;
        if (!validGenetics.test(geneticsInput)) {
            errorMsg.style.display = 'block';
            resultBox.style.display = 'none';
            return;
        }
        errorMsg.style.display = 'none';

        // Walidacja liczb
        if (isNaN(percent) || percent < 0 || percent > 100 || isNaN(overall) || overall < 0 || overall > 100) {
            alert("Podaj poprawne wartości procentowe od 0 do 100.");
            return;
        }

        let gCount = (geneticsInput.match(/G/g) || []).length;
        
        // Zabezpieczenie przed dzieleniem przez zero, gdy Overall wynosi 0%
        if (overall === 0) {
            document.getElementById('res-g').innerText = gCount;
            document.getElementById('res-stage').innerText = "Zatrzymany (0% Overall)";
            document.getElementById('res-total').innerText = "Zatrzymany / Brak wzrostu";
            document.getElementById('res-total').style.color = "#ff5252";
            resultBox.style.display = 'block';
            return;
        }

        // Mnożnik za geny G (np. +15% za każdy)
        let gMultiplier = 1 + (gCount * 0.15);
        
        // Mnożnik za Overall (100% to 1.0, 50% to 0.5)
        let overallMultiplier = overall / 100;

        // Łączna prędkość wzrostu
        let totalSpeedMultiplier = gMultiplier * overallMultiplier;

        // Wyliczamy pozostały czas dla aktualnego stage'a
        let currentBaseTime = stages[stageIndex].baseTime;
        let currentRealTime = currentBaseTime / totalSpeedMultiplier;
        let timeLeftCurrent = currentRealTime * ((100 - percent) / 100);

        // Wyliczamy czas dla wszystkich następnych stage'y
        let timeRemainingTotal = timeLeftCurrent;
        for (let i = stageIndex + 1; i < stages.length; i++) {
            let nextRealTime = stages[i].baseTime / totalSpeedMultiplier;
            timeRemainingTotal += nextRealTime;
        }

        // Formatowanie i wyświetlanie wyników
        document.getElementById('res-g').innerText = gCount;
        document.getElementById('res-stage').innerText = Math.round(timeLeftCurrent) + " min";
        document.getElementById('res-total').innerText = Math.round(timeRemainingTotal) + " min";
        document.getElementById('res-total').style.color = "#4CAF50"; // Przywracamy zielony kolor, jeśli wcześniej był czerwony
        
        resultBox.style.display = 'block';
    }
</script>

</body>
</html>
