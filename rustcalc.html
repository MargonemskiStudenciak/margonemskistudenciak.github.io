<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RustGrow Calculator V5</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f2f2f2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2b2b2b;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #1f1f1f;
            color: #fff;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        input[type="number"] {
            text-transform: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #333;
            border-left: 5px solid #4CAF50;
            border-radius: 4px;
            display: none;
        }
        .result-box h3 { margin-top: 0; margin-bottom: 10px;}
        .error { color: #ff5252; font-size: 13px; margin-top: 5px; display: none;}
        .flex-row { display: flex; gap: 10px; }
        .flex-col { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <h1>RustGrow Calculator</h1>
    <p class="subtitle">Wersja 5.0: Niezależna prędkość bazowa</p>

    <div class="flex-row">
        <div class="flex-col">
            <label for="plant">Co sadzisz?</label>
            <select id="plant">
                <option value="hemp">Hemp (Konopie)</option>
                <option value="berry">Berry (Jagody)</option>
                <option value="food">Food (Ziemniaki itp.)</option>
            </select>
        </div>
        <div class="flex-col">
            <label for="overall">Overall (%):</label>
            <input type="number" id="overall" min="0" max="100" value="100">
        </div>
    </div>

    <label for="genetics">Klon Genetyki (np. GGYYXW):</label>
    <input type="text" id="genetics" maxlength="6" placeholder="Wpisz 6 liter (G, Y, H, X, W)">
    <div id="error-msg" class="error">Genetyka musi mieć 6 liter (G, Y, H, X, W).</div>

    <div class="flex-row">
        <div class="flex-col" style="flex: 2;">
            <label for="stage">Aktualny Stage:</label>
            <select id="stage">
                <option value="0">Seed (Nasiono)</option>
                <option value="1">Seedling (Kiełek)</option>
                <option value="2">Sapling (Sadzonka)</option>
                <option value="3">Crossbreed (Krzyżowanie)</option>
                <option value="4">Mature (Dojrzewanie)</option>
                <option value="5">Fruiting (Owocowanie)</option>
            </select>
        </div>
        <div class="flex-col" style="flex: 1;">
            <label for="percent">Progres (%):</label>
            <input type="number" id="percent" min="0" max="100" placeholder="np. 35">
        </div>
    </div>

    <button onclick="calculateTime()">Oblicz Czas</button>

    <div id="result" class="result-box">
        <h3>Wyniki:</h3>
        <p>Ilość genów 'G': <strong id="res-g">0</strong></p>
        <p>Do końca <b>obecnego etapu</b>: <strong id="res-stage">0 min</strong></p>
        <p>Czas do <b>pełnych zbiorów (Ripe)</b>: <strong style="color:#4CAF50;" id="res-total">0 min</strong></p>
    </div>
</div>

<script>
    // Zoptymalizowane czasy bazowe w minutach
    const plantData = {
        hemp: [
            { name: "Seed", baseTime: 2 },
            { name: "Seedling", baseTime: 16 }, 
            { name: "Sapling", baseTime: 14 },
            { name: "Crossbreed", baseTime: 2 },
            { name: "Mature", baseTime: 38 }, 
            { name: "Fruiting", baseTime: 38 } 
        ],
        berry: [
            { name: "Seed", baseTime: 2 },
            { name: "Seedling", baseTime: 8 }, 
            { name: "Sapling", baseTime: 10 },
            { name: "Crossbreed", baseTime: 2 },
            { name: "Mature", baseTime: 30 },
            { name: "Fruiting", baseTime: 25 }
        ],
        food: [
            { name: "Seed", baseTime: 2 },
            { name: "Seedling", baseTime: 18 },
            { name: "Sapling", baseTime: 18 },
            { name: "Crossbreed", baseTime: 2 },
            { name: "Mature", baseTime: 45 },
            { name: "Fruiting", baseTime: 40 }
        ]
    };

    function calculateTime() {
        const plantType = document.getElementById('plant').value;
        const geneticsInput = document.getElementById('genetics').value.toUpperCase();
        const overall = parseFloat(document.getElementById('overall').value);
        const stageIndex = parseInt(document.getElementById('stage').value);
        const percent = parseFloat(document.getElementById('percent').value);
        
        const errorMsg = document.getElementById('error-msg');
        const resultBox = document.getElementById('result');

        const stages = plantData[plantType];

        const validGenetics = /^[GYHXW]{6}$/;
        if (!validGenetics.test(geneticsInput)) {
            errorMsg.style.display = 'block';
            resultBox.style.display = 'none';
            return;
        }
        errorMsg.style.display = 'none';

        if (isNaN(percent) || percent < 0 || percent > 100 || isNaN(overall) || overall < 0 || overall > 100) {
            alert("Podaj poprawne wartości procentowe (0-100).");
            return;
        }

        let gCount = (geneticsInput.match(/G/g) || []).length;
        
        // Jedyny wpływ Overall na czas to całkowite zatrzymanie przy 0%
        if (overall === 0) {
            document.getElementById('res-g').innerText = gCount;
            document.getElementById('res-stage').innerText = "Zatrzymany (0% Overall)";
            document.getElementById('res-total').innerText = "Zatrzymany / Brak wzrostu";
            document.getElementById('res-total').style.color = "#ff5252";
            resultBox.style.display = 'block';
            return;
        }

        // Usunięto overallMultiplier - prędkość dyktują wyłącznie geny G
        let totalSpeedMultiplier = 1 + (gCount * 0.15);

        let currentBaseTime = stages[stageIndex].baseTime;
        let currentRealTime = currentBaseTime / totalSpeedMultiplier;
        let timeLeftCurrent = currentRealTime * ((100 - percent) / 100);

        let timeRemainingTotal = timeLeftCurrent;
        for (let i = stageIndex + 1; i < stages.length; i++) {
            let nextRealTime = stages[i].baseTime / totalSpeedMultiplier;
            timeRemainingTotal += nextRealTime;
        }

        document.getElementById('res-g').innerText = gCount;
        
        function formatTime(minutesDecimal) {
            let mins = Math.floor(minutesDecimal);
            let secs = Math.round((minutesDecimal - mins) * 60);
            if (secs === 60) { mins++; secs = 0; }
            return `${mins} min ${secs} sek`;
        }

        document.getElementById('res-stage').innerText = formatTime(timeLeftCurrent);
        document.getElementById('res-total').innerText = formatTime(timeRemainingTotal);
        document.getElementById('res-total').style.color = "#4CAF50";
        
        resultBox.style.display = 'block';
    }
</script>

</body>
</html>
